<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <form action="">

            <div>
                <label for="name">Name</label>

        <div>

            <input type="radio" name="gender" id="female">

            <input type="radio" name="gender" id="other">
